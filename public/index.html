<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The react-native-web style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #eee8dd;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #13161a;
        }
      }
    </style>
    <!-- Shown until the app draws its first screen, so a slow or failed start is never a blank page. -->
    <style id="boot-style">
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #eee8dd;
        color: #23201b;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      #boot .pebble {
        width: 46px;
        height: 38px;
        border-radius: 52% 48% 46% 54% / 58% 56% 44% 42%;
        background: radial-gradient(circle at 35% 30%, #a9b7a0, #6f8466 70%);
        box-shadow: 0 6px 14px rgba(35, 32, 27, 0.18);
        animation: breathe 2.4s ease-in-out infinite;
        margin-bottom: 18px;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1, 1);
        }
        50% {
          transform: scale(1.05, 0.95) translateY(1px);
        }
      }
      #boot .name {
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      #boot .msg {
        margin-top: 6px;
        opacity: 0.7;
        max-width: 420px;
      }
      #boot pre {
        display: none;
        margin: 18px 0 0;
        max-width: min(640px, 100%);
        max-height: 40vh;
        overflow: auto;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(35, 32, 27, 0.07);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot .tip {
        display: none;
        margin-top: 14px;
        max-width: 460px;
        font-size: 14px;
      }
      #boot code {
        font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
        background: rgba(35, 32, 27, 0.07);
        padding: 1px 5px;
        border-radius: 5px;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #13161a;
          color: #ece6da;
        }
        #boot pre,
        #boot code {
          background: rgba(236, 230, 218, 0.08);
        }
      }
    </style>
  </head>

  <body>
    <noscript>Eternity needs JavaScript turned on.</noscript>
    <div id="boot" role="status" aria-live="polite">
      <div class="pebble"></div>
      <div class="name">Eternity</div>
      <div class="msg" id="boot-msg">Waking up your Crew…</div>
      <pre id="boot-detail"></pre>
      <div class="tip" id="boot-tip"></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        // The app removes #boot itself once its first screen is up (lib/boot.ts).
        var root = document.getElementById('root');
        var msg = document.getElementById('boot-msg');
        var detail = document.getElementById('boot-detail');
        var tip = document.getElementById('boot-tip');
        var failed = false;
        function up() {
          return !!document.getElementById('boot');
        }

        function clean(text) {
          // Metro error messages carry terminal colors; drop them.
          return String(text || '').replace(/\u001b\[[0-9;]*m/g, '').trim().slice(0, 4000);
        }
        function show(title, text, help) {
          if (!up()) return;
          failed = true;
          msg.textContent = title;
          msg.style.opacity = '1';
          if (text) {
            detail.textContent = clean(text);
            detail.style.display = 'block';
          }
          if (help) {
            tip.innerHTML = help;
            tip.style.display = 'block';
          }
        }

        var DEV_HELP =
          'Usually this means new packages aren’t installed yet. In the terminal: press <b>Ctrl+C</b>, run ' +
          '<code>npm install</code>, then <code>npx expo start --web -c</code>, and refresh this page.';

        // The app's script didn't load or didn't build.
        window.addEventListener(
          'error',
          function (e) {
            var el = e && e.target;
            if (!el || el.tagName !== 'SCRIPT' || !el.src) return;
            fetch(el.src)
              .then(function (r) {
                return r.text();
              })
              .then(function (body) {
                var why = '';
                try {
                  why = JSON.parse(body).message || '';
                } catch (_) {}
                if (why) show('Eternity couldn’t build. Here’s why:', why, DEV_HELP);
                else show('Couldn’t load Eternity. Check your connection and refresh.');
              })
              .catch(function () {
                show('Couldn’t load Eternity. Check your connection and refresh.');
              });
          },
          true,
        );

        // The app loaded but crashed before its first screen. Wait a moment first:
        // if the app draws anyway, the error didn't matter and this never shows.
        function crashed(err) {
          var text = err && (err.stack || err.message) ? err.stack || err.message : String(err || '');
          setTimeout(function () {
            if (up() && !failed) show('Eternity hit an error while starting.', text, 'Refresh to try again. The message above says where to look.');
          }, 2500);
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') return;
          if (up()) crashed(e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (up()) crashed(e.reason);
        });

        // A cold first build on a dev server can take a while.
        setTimeout(function () {
          if (up() && !failed) msg.textContent = 'Still getting ready. The first load after an update can take a minute.';
        }, 20000);
        // Safety net: if the app is clearly on screen but never said so, step aside.
        setTimeout(function () {
          var b = document.getElementById('boot');
          if (b && !failed && root.innerText.trim()) b.parentNode.removeChild(b);
        }, 15000);
      })();
    </script>
  </body>
</html>
